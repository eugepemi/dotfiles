- defaults:
    link:
      relink: true
      create: true
      force: true
      glob: true

- clean: ["~"]

- link:
    ~/.zshrc: config/.zshrc
    ~/.gitconfig: config/git/.gitconfig
    ~/.config/starship/starship.toml: config/starship/starship.toml
    ~/.config/bat/bat.conf: config/bat/bat.conf
    ~/.config/atuin/config.toml: config/atuin/config.toml
    ~/.config/ghostty/config: config/ghostty/config
    ~/Library/Application Support/Code/User/settings.json: config/vscode/settings.json
    # Link the directory, not karabiner.json: Karabiner replaces the file on save, breaking a file symlink
    ~/.config/karabiner: config/karabiner
    ~/.config/zed/settings.json: config/zed/settings.json

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - command: os/mac/install.sh
      description: Installing Homebrew and Brewfile packages
      stdin: true
      stdout: true
      stderr: true
